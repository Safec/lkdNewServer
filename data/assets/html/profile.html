<body>
<div class="profile-page">
    <aside class="sidebar profile-page__sidebar">
        <a class="menu-profile sidebar__profile" href="/designer/profile">
            <img class="menu-profile__photo" src="/build/images/missing-image--small.svg" alt="">

        </a>

            <ul class="side-menu sidebar__menu">
                <li class="side-menu__item">
                    <a class="side-menu-link side-menu__link side-menu-link--disabled "

                        <div class="mask-icon mask-icon--design side-menu-link__icon"></div>
                        <p class="side-menu-link__text">Портфолио</p>
                    </a>
                </li>
                <li class="side-menu__item">
                    <a class="side-menu-link side-menu__link side-menu-link--disabled "

                        <div class="mask-icon mask-icon--ar-view side-menu-link__icon"></div>
                        <p class="side-menu-link__text">Каталог моделей</p>
                    </a>
                </li>
                <li class="side-menu__item">
                    <a class="side-menu-link side-menu__link side-menu-link--disabled "

                        <div class="mask-icon mask-icon--brush side-menu-link__icon"></div>
                        <p class="side-menu-link__text">Черновики</p>
                    </a>
                </li>
                <li class="side-menu__item">
                    <a class="side-menu-link side-menu__link  active"

                    >
                        <div class="mask-icon mask-icon--face side-menu-link__icon"></div>
                        <p class="side-menu-link__text">Профиль</p>
                    </a>
                </li>
                <li class="side-menu__item">
                    <a class="side-menu-link side-menu__link  "

                        <div class="mask-icon mask-icon--snippet side-menu-link__icon"></div>
                        <p class="side-menu-link__text">Реквизиты и договоры</p>
                    </a>
                </li>
                <li class="side-menu__item">
                    <a class="side-menu-link side-menu__link  "

        <div class="container">
            <div class="main-header main__header">

                    <i class="mask-icon mask-icon--small mask-icon--exit mr-2"></i>
                    Выйти

                                    <span>
                        <span class="fill-mine-shaft mb-2 text-center">
                            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                                <path d="M10.5 8L10.5 0L8.5 0L8.5 8L0.5 8L0.5 10L8.5 10L8.5 18H10.5V10H18.5V8L10.5 8Z"/>
                            </svg>
                        </span>
                        <small class="font-bold mb-1">Загрузить<br/>изображение</small>
                        <small class="text-dim w-[120px]"><div id="profile_avatar_file_help" class="mt-1 help-text">jpg, png, gif, webp<br/>
(до 5 мб)</div></small>
                    </span>
                                </label>

                                <input type="hidden" id="profile_avatar" name="profile[avatar]" class="mt-1 w-full"/>

                                <div class="profile__file-uploader__delete !hidden"
                                     onclick="App.UI.AvatarUploader.onDelete(this);"></div>
                            </div>
                        </div>

                                <div></div>

                                <div class="profile__form__section">
                                    <h4>Личные данные</h4>

                                                                 for="profile_fullName">ФИО</label><input type="text"
                                                                                                          id="profile_fullName"
                                                                                                          name="profile[fullName]"
                                                                                                          required="required"
                                                                                                          placeholder="Иванов Иван"
                                                                                                          class="mt-1 w-full"/>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="mb-5"><label class="block required"
                                                                 for="profile_phone">Телефон</label><input type="text"
                                                                                                           id="profile_phone"
                                                                                                           name="profile[phone]"
                                                                                                           disabled="disabled"
                                                                                                           required="required"
                                                                                                           maxlength=""
                                                                                                           data-mask="+{7} (000) 000-00-00"
                                                                                                           placeholder="+7 (___) ___-__-__"
                                                                                                           class="mt-1 w-full border-gray-300 text-gray-500"
                                                                                                           value="+79998768545"/>
                                        </div>
                                        <div class="mb-5"><label class="block required"
                                                                 for="profile_email">Почта</label><input type="email"
                                                                                                         id="profile_email"
                                                                                                         name="profile[email]"
                                                                                                         required="required"
                                                                                                         maxlength="128"
                                                                                                         placeholder="info@gmail.com"
                                                                                                         class="mt-1 w-full"/>

                                    </div>

<div id="ui-alerts" class="alerts-container"></div>
<script type="text/javascript">
    window.__alerts__ = [];
</script>

<div id="popup-alert-prototype" class="popup !hidden">
    <div class="popup__screen" onclick="this.closest('.popup').remove()"></div>

    <div class="popup__window">
        <span class="popup__window__close" onclick="this.closest('.popup').remove()"></span>

        <div class="popup__window__title">{{title}}</div>

        <div class="popup__window__text">{{message}}</div>

        <div>
            <div class="popup__window__buttons">
                <button type="button" class="button button--primary w-full cursor-pointer"
                        onclick="this.closest('.popup').remove()"
                >
                    {{button}}
                </button>
            </div>
        </div>
    </div>
</div>

<div id="popup-question-prototype" class="popup !hidden">
    <div class="popup__screen" onclick="this.closest('.popup').classList.add('!hidden')"></div>

    <div class="popup__window">
        <span class="popup__window__close" onclick="this.closest('.popup').classList.add('!hidden')"></span>
        <div class="popup__window__title">{{question}}</div>
        <div class="popup__window__buttons">
            <button type="button" class="popup-yes button button--secondary w-full cursor-pointer" onclick="">Да
            </button>
            <button type="button" class="button button--primary w-full cursor-pointer"
                    onclick="this.closest('.popup').remove()">Нет
            </button>
        </div>
    </div>
</div>
