twig:
    default_path: '%kernel.project_dir%/templates'
    form_themes: ['form/theme.html.twig']
    globals:
        h_captcha:
            enabled: '%h_captcha.enabled%'
            sitekey: '%h_captcha.sitekey%'
        parameters:
            images:
                path: '%images.path%'
            uploads:
                path: '%uploads.path%'

when@test:
    twig:
        strict_variables: true
