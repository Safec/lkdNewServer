services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ../data:/var/www/html
      - ../nginx/hosts/dev.conf:/etc/nginx/conf.d/default.conf:ro

  php-fpm:
    environment:
      - APP_ENV=dev
    volumes:
      - ../data:/var/www/html
      - ../fpm/zzz-custom.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf:ro

  database:
    ports:
      - "5432:5432"
    volumes:
      - ../base/database:/var/lib/postgresql/data

  redis:
    ports:
      - "6379:6379"

  mailer:
    image: schickling/mailcatcher
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - app_network