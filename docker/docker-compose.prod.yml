services:
  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../data:/var/www/html
      - /mnt/data/public:/mnt/data/public:ro     # public uploads only, read-only
      - ../nginx/hosts/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl/lkd.askona.ru.crt:/etc/nginx/ssl/lkd.askona.ru.crt:ro
      - /etc/nginx/ssl/lkd.askona.ru.key:/etc/nginx/ssl/lkd.askona.ru.key:ro
    # /mnt/data/uploads (private) NOT mounted here

  php-fpm:
    restart: always
    volumes:
      - ../data:/var/www/html
      - /mnt/data:/mnt/data                        # всё, включая приватные
      - ../fpm/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    environment:
      - APP_ENV=prod

  database:
    restart: always
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data

  redis:
    restart: always