server {
    listen 80 default_server;
    server_name lkd.askona.ru _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 300M;

    # uploads (data/public/uploads -> /mnt/data/public/uploads)
    location /uploads/ {
        alias /mnt/data/public/uploads/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-fpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(jpg|jpeg|gif|css|png|js|ico|svg|webp|woff2?)$ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}